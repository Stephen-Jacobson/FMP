<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      function resize() {
        canvas.width = screen.width
        canvas.height = screen.height
      }
      resize();

      let USE_DELTA_TIME = true

      const MAX = 400000;
      const px = new Float32Array(MAX);
      const py = new Float32Array(MAX);
      const vx = new Float32Array(MAX);
      const vy = new Float32Array(MAX);
      const age = new Float32Array(MAX);

      const cr = new Uint8Array(MAX)  // red 0-255
      const cg = new Uint8Array(MAX)  // green 0-255
      const cb = new Uint8Array(MAX)  // blue 0-255

      let speedMap = new Float32Array(canvas.width * canvas.height);

      function buildSpeedMap(img) {
        speedMap = new Float32Array(canvas.width * canvas.height)

        const offscreen = document.createElement("canvas");
        offscreen.width = canvas.width;
        offscreen.height = canvas.height;
        const offCtx = offscreen.getContext("2d");
        offCtx.drawImage(img, 0, 0);
        const pixels = offCtx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height,
        ).data;
        for (let i = 0; i < speedMap.length; i++) {
          const brightness = pixels[i * 4] / 255;
          speedMap[i] = 0.05 + (1.0 - brightness) * 0.95;
        }
      }

      const COLOURS = [
        [255, 0, 0],    // red
        [0, 255, 0],    // green
        [0, 0, 255],    // blue
      ]

      let lineIndex = 0

      function emitLine() {
        const colour = COLOURS[lineIndex % COLOURS.length]
        lineIndex++

        let row = 0;
        for (let i = 0; i < MAX && row < canvas.height; i++) {
          if (age[i] === 0) {
            px[i] = 0;
            py[i] = row;
            vx[i] = 1.0;
            vy[i] = 0;
            age[i] = 1;

            // random colour per particle
            // const colorChoice = Math.floor(Math.random() * 3)
            
            // cr[i] = Math.floor(Math.random() * 256)
            // cg[i] = Math.floor(Math.random() * 256)
            // cb[i] = Math.floor(Math.random() * 256)


            // each line gets colour in list
            cr[i] = colour[0]
            cg[i] = colour[1]
            cb[i] = colour[2]
            row++


          }
        }
      }

      let mouseX = 0;
      let mouseY = 0;
      let mouseDown = false;

      let emitting = false;

      canvas.addEventListener("click", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        emitting = !emitting; // toggle on/off
      });

      //   canvas.addEventListener('mousedown', (e) => {
      //     mouseX = e.clientX;
      //     mouseY = e.clientY;
      //     mouseDown = true;
      //   });

      //   canvas.addEventListener('mousemove', (e) => {
      //     if (mouseDown) {
      //       mouseX = e.clientX;
      //       mouseY = e.clientY;
      //     }
      //   });

      //   canvas.addEventListener('mouseup', () => mouseDown = false);

      function emitCircle() {
        const numParticles = 500;
        const radius = 10; // size of the circle
        let spawned = 0;
        for (let i = 0; i < MAX && spawned < numParticles; i++) {
          if (age[i] === 0) {
            const angle = (spawned / numParticles) * Math.PI * 2;
            px[i] = mouseX + Math.cos(angle) * radius;
            py[i] = mouseY + Math.sin(angle) * radius;
            vx[i] = Math.cos(angle) * 2.0;
            vy[i] = Math.sin(angle) * 2.0;
            age[i] = 1;
            spawned++;
          }
        }
      }

      let frameCount = 0;
      let imageData = ctx.createImageData(canvas.width, canvas.height);
      let data = imageData.data;

      let lastTime = performance.now()
      let lastEmitTime = performance.now()
      const EMIT_INTERVAL = 7 * 16.67  // ms between lines, same feel as every 7 frames at 60fps

      function loop() {
        requestAnimationFrame(loop)

        let dt = 1
        const now = performance.now()

        if (USE_DELTA_TIME) {
          dt = (now - lastTime) / 16.67
          dt = Math.min(dt, 3)
          lastTime = now
        }

        data.fill(0)

        if (now - lastEmitTime >= EMIT_INTERVAL) {
          emitLine()
          lastEmitTime = now
        }

        for (let i = 0; i < MAX; i++) {
          if (age[i] === 0) continue
          let speed = speedMap[Math.floor(py[i]) * canvas.width + Math.floor(px[i])]
          px[i] += vx[i] * speed * dt
          py[i] += vy[i] * speed * dt

          const ix = Math.floor(px[i]);
          const iy = Math.floor(py[i]);
          const idx = (iy * canvas.width + ix) * 4;
          data[idx] = cr[i];
          data[idx + 1] = cg[i];
          data[idx + 2] = cb[i];
          data[idx + 3] = 255;

          age[i]++;

          if (age[i] > 200000 || px[i] > canvas.width || px[i] < 0 || py[i] > canvas.height || py[i] < 0) {
            age[i] = 0;
          }
        }

        ctx.putImageData(imageData, 0, 0);
      }

      const img = new Image();
      img.src = "removed_me.png";
      img.onload = () => {
        buildSpeedMap(img);
        loop();
      };

      window.addEventListener('resize', () => {
        resize()
        if (img.complete) buildSpeedMap(img)
        imageData = ctx.createImageData(canvas.width, canvas.height)
        data = imageData.data
      })
    </script>
  </body>
</html>
