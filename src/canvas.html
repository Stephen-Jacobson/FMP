<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();

      const MAX = 500000;
      const px = new Float32Array(MAX);
      const py = new Float32Array(MAX);
      const vx = new Float32Array(MAX);
      const vy = new Float32Array(MAX);
      const age = new Float32Array(MAX);

      const cr = new Uint8Array(MAX)  // red 0-255
      const cg = new Uint8Array(MAX)  // green 0-255
      const cb = new Uint8Array(MAX)  // blue 0-255

      const speedMap = new Float32Array(canvas.width * canvas.height);

      function buildSpeedMap(img) {
        const offscreen = document.createElement("canvas");
        offscreen.width = canvas.width;
        offscreen.height = canvas.height;
        const offCtx = offscreen.getContext("2d");
        offCtx.drawImage(img, 0, 0);
        const pixels = offCtx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height,
        ).data;
        for (let i = 0; i < speedMap.length; i++) {
          const brightness = pixels[i * 4] / 255;
          speedMap[i] = 0.05 + (1.0 - brightness) * 0.95;
        }
      }

      function emitLine() {
        let row = 0;
        for (let i = 0; i < MAX && row < canvas.height; i++) {
          if (age[i] === 0) {
            px[i] = 0;
            py[i] = row;
            vx[i] = 8.0;
            vy[i] = 0;
            age[i] = 1;

            const colorChoice = Math.floor(Math.random() * 3)
            cr[i] = colorChoice === 0 ? 255 : 0
            cg[i] = colorChoice === 1 ? 255 : 0
            cb[i] = colorChoice === 2 ? 255 : 0

            row++;
          }
        }
      }

      let mouseX = 0;
      let mouseY = 0;
      let mouseDown = false;

      let emitting = false;

      canvas.addEventListener("click", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        emitting = !emitting; // toggle on/off
      });

      //   canvas.addEventListener('mousedown', (e) => {
      //     mouseX = e.clientX;
      //     mouseY = e.clientY;
      //     mouseDown = true;
      //   });

      //   canvas.addEventListener('mousemove', (e) => {
      //     if (mouseDown) {
      //       mouseX = e.clientX;
      //       mouseY = e.clientY;
      //     }
      //   });

      //   canvas.addEventListener('mouseup', () => mouseDown = false);

      function emitCircle() {
        const numParticles = 500;
        const radius = 10; // size of the circle
        let spawned = 0;
        for (let i = 0; i < MAX && spawned < numParticles; i++) {
          if (age[i] === 0) {
            const angle = (spawned / numParticles) * Math.PI * 2;
            px[i] = mouseX + Math.cos(angle) * radius;
            py[i] = mouseY + Math.sin(angle) * radius;
            vx[i] = Math.cos(angle) * 2.0;
            vy[i] = Math.sin(angle) * 2.0;
            age[i] = 1;
            spawned++;
          }
        }
      }

      let frameCount = 0;

      function loop() {
        requestAnimationFrame(loop);
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;

        frameCount++;
        if (frameCount % 30 === 0) emitLine();
        //if (frameCount % 15 === 0) if (emitting) emitCircle();

        for (let i = 0; i < MAX; i++) {
          if (age[i] === 0) continue;

          let speed = speedMap[Math.floor(py[i]) * canvas.width + Math.floor(px[i])];

          px[i] += vx[i] * speed;
          py[i] += vy[i] * speed;

          const ix = Math.floor(px[i]);
          const iy = Math.floor(py[i]);
          const idx = (iy * canvas.width + ix) * 4;
          data[idx] = cr[i];
          data[idx + 1] = cg[i];
          data[idx + 2] = cb[i];
          data[idx + 3] = 255;

          age[i]++;

          if (
            px[i] > canvas.width ||
            px[i] < 0 ||
            py[i] > canvas.height ||
            py[i] < 0
          ) {
            age[i] = 0;
          }
        }

        ctx.putImageData(imageData, 0, 0);
      }

      const img = new Image();
      img.src = "pe.png";
      img.onload = () => {
        buildSpeedMap(img);
        loop();
      };

      window.addEventListener("resize", resize);
    </script>
  </body>
</html>
